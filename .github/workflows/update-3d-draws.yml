name: Update 3D draw results

on:
  schedule:
    # Every 5 minutes from 21:20 to 21:40 China time (UTC+8)
    - cron: '20,25,30,35,40 13 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: update-3d-draws
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch official 3D results
        run: node scripts/fetch_3d.mjs
      - name: Commit updated results
        run: |
          if git diff --quiet -- draws.json; then
            echo "No draw changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add draws.json
          git commit -m "chore: update 3D draw results"
          git push
      - name: Report fetch failure
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(TZ=Asia/Shanghai date +%F)
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "3D 开奖号抓取失败 $DATE" \
            --body "21:20-21:40 期间未获取到 ${DATE} 的 3D 开奖号。请检查福彩官网，或在网页中手动填写。运行记录：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
